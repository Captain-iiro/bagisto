# =============================================================================
# Bagisto — Dokploy production compose
#
# Deploy in Dokploy: New service → Compose (type: Docker Compose),
# Source: Git (your fork), Compose Path: ./docker-compose.prod.yml
#
# Required environment variables (Dokploy UI):
#   DOMAIN               e.g. shop.votredomaine.com
#   APP_URL              https://shop.votredomaine.com
#   APP_KEY              run `php artisan key:generate` locally to produce one
#   DB_PASSWORD          strong password for the MySQL app user
#   MYSQL_ROOT_PASSWORD  strong root password for MySQL
#
# Optional: APP_ADMIN_URL, APP_TIMEZONE, APP_LOCALE, APP_CURRENCY, ...
# =============================================================================

services:
  app:
    build:
      context: .
      dockerfile: docker/deploy/Dockerfile
    restart: always
    environment:
      # NOTE: do NOT pass APP_ENV here. The Bagisto installer runs on first
      # boot and Laravel cancels its destructive commands when the app is in
      # production mode; the entrypoint flips APP_ENV in .env to production
      # only after installation completes.
      APP_DEBUG: 'false'
      APP_URL: ${APP_URL:-http://localhost}
      APP_KEY: ${APP_KEY}
      APP_ADMIN_URL: ${APP_ADMIN_URL:-admin}
      APP_TIMEZONE: ${APP_TIMEZONE:-UTC}
      DB_HOST: mysql
      DB_PORT: '3306'
      DB_DATABASE: ${DB_DATABASE:-bagisto}
      DB_USERNAME: ${DB_USERNAME:-bagisto}
      DB_PASSWORD: ${DB_PASSWORD:-bagisto}
      REDIS_HOST: redis
      REDIS_PORT: '6379'
    volumes:
      - bagisto-storage:/var/www/bagisto/storage
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    networks:
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.bagisto.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.bagisto.entrypoints=websecure"
      - "traefik.http.routers.bagisto.tls.certResolver=letsencrypt"
      - "traefik.http.services.bagisto.loadbalancer.server.port=80"

  mysql:
    image: mysql:8.0
    restart: always
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE:-bagisto}
      MYSQL_USER: ${DB_USERNAME:-bagisto}
      MYSQL_PASSWORD: ${DB_PASSWORD:-bagisto}
    volumes:
      - bagisto-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h 127.0.0.1 -u root"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - dokploy-network

  redis:
    image: redis:7-alpine
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - bagisto-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - dokploy-network

volumes:
  bagisto-mysql:
  bagisto-redis:
  bagisto-storage:

networks:
  dokploy-network:
    external: true
